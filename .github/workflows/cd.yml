name: Continuous Deployment Pipeline
run-name: BE CD triggered by ${{ github.actor }}

on:
  workflow_run:
    workflows: ["Continuous Integration Pipeline (Maven Build, Package, Docker)"]
    types:
      - completed

concurrency:
  group: be-cd-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.yml"
          target: "/root/app"

      - name: Create .env on VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            mkdir -p /root/app
            cd /root/app

            # 1. Kiểm tra dung lượng đĩa trống và khởi tạo Swap 2GB (Idempotent)
            DISK_FREE=$(df / --output=avail -BG | tail -1 | tr -d 'G ')
            if [ "$DISK_FREE" -ge 5 ]; then
                if [ ! -f /swapfile ]; then
                    echo "Dung lượng đĩa trống ${DISK_FREE}GB. Tạo swap file 2GB..."
                    fallocate -l 2G /swapfile || true
                    chmod 600 /swapfile || true
                    mkswap /swapfile || true
                    swapon /swapfile || true
                    echo '/swapfile none swap sw 0 0' >> /etc/fstab || true
                else
                    echo "Swapfile đã tồn tại, bỏ qua."
                fi
            else
                echo "⚠️ Dung lượng đĩa còn dưới 5GB (${DISK_FREE}GB), bỏ qua tạo swap để tránh tràn đĩa!"
            fi

            # 2. Cấu hình vm.swappiness=10
            sed -i '/vm.swappiness/d' /etc/sysctl.conf || true
            echo 'vm.swappiness=10' >> /etc/sysctl.conf || true
            sysctl -w vm.swappiness=10 || true

            # 3. Tạo file .env từ secrets
            cat > .env << 'ENVEOF'
            DB_URL=jdbc:mysql://mysql:3306/aistudyhub
            DB_USERNAME=root
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}

            SYSTEM_ADMIN_EMAIL=${{ secrets.SYSTEM_ADMIN_EMAIL }}
            SYSTEM_ADMIN_PASSWORD=${{ secrets.SYSTEM_ADMIN_PASSWORD }}
            SYSTEM_ADMIN_FULL_NAME=${{ secrets.SYSTEM_ADMIN_FULL_NAME }}

            JWT_SIGNER_KEY=${{ secrets.JWT_SIGNER_KEY }}

            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}

            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}

            SPRING_AI_OPENAI_API_KEY=${{ secrets.SPRING_AI_OPENAI_API_KEY }}

            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            ENVEOF

            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            echo "Deploying image: ${DOCKER_USERNAME}/be-ai-study-hub:${IMAGE_TAG}"

            docker compose pull
            docker compose up -d --remove-orphans

            echo "Đợi 15 giây cho Java Spring Boot sẵn sàng..."
            sleep 15

            echo "Cập nhật Nginx Proxy Manager..."
            docker exec nginx-proxy-manager-app-proxy-1 nginx -s reload || true

            echo "Dọn dẹp các Docker image rác cũ..."
            docker image prune -af --filter "until=24h" || true

            echo "Deploy completed! Running containers:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"