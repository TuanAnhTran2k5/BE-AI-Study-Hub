services:
  # ─────────────────────────────────────────────────────────
  # MySQL 8.0 - Database chinh cua ung dung
  # ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: aistudyhub
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m

  # ─────────────────────────────────────────────────────────
  # Qdrant - Vector database cho AI/RAG
  # ─────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333" # REST API & Dashboard
      - "6334:6334" # gRPC API (used by Spring AI)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    mem_limit: 400m

  # ─────────────────────────────────────────────────────────
  # Backend - Spring Boot App
  # Pull image tu Docker Hub (CI da build va push)
  # Override localhost -> service name cho Docker network
  # ─────────────────────────────────────────────────────────
  backend:
    image: ${DOCKER_USERNAME}/be-ai-study-hub:${IMAGE_TAG:-latest}
    container_name: backend-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/aistudyhub
      - SPRING_AI_VECTORSTORE_QDRANT_HOST=qdrant
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - default
      - app-network


volumes:
  mysql_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  app-network:
    external: true