services:
  # ─────────────────────────────────────────────────────────
  # MySQL 8.0 - Database chính của ứng dụng
  # ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: aistudyhub
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────
  # Qdrant - Vector database cho AI/RAG
  # ─────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333" # REST API & Dashboard
      - "6334:6334" # gRPC API (used by Spring AI)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    restart: unless-stopped
    mem_limit: 300m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────
  # Backend - Spring Boot App
  # ─────────────────────────────────────────────────────────
  backend:
    image: ${DOCKER_USERNAME}/be-ai-study-hub:${IMAGE_TAG:-latest}
    container_name: backend-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/aistudyhub
      - SPRING_AI_VECTORSTORE_QDRANT_HOST=qdrant
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx600m -XX:MaxMetaspaceSize=200m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=128m
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/user/academic/semesters || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1000m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - app-network

volumes:
  mysql_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  app-network:
    external: true